[package]
name = "taurus-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Taurus AI Shell desktop application"

[lib]
# Required on mobile targets and harmless elsewhere; keeps main.rs a stub so
# the app logic stays testable as a library.
name = "taurus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# What separates a shippable binary from a dev one — and it is the feature, not
# the profile, that decides. `tauri`'s build script sets `cfg(dev)` to
# `!custom_protocol`, and `cfg(dev)` is what makes the webview load `devUrl`
# instead of the bundled frontend. So `cargo build --release` without this
# produces an optimized binary that still points at http://localhost:1420 and
# opens on "localhost refused to connect" wherever no dev server is listening.
#
# `tauri build` passes `tauri/custom-protocol` itself. This exists so that a
# plain cargo build can say the same thing, and so `lib.rs` can refuse to
# compile a release that would ship without it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
taurus-core.workspace = true
taurus-host.workspace = true
taurus-telemetry.workspace = true
taurus-mcp.workspace = true
taurus-provider.workspace = true
taurus-agents.workspace = true
taurus-skills.workspace = true
taurus-tools.workspace = true

async-trait.workspace = true
dashmap = "6"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[lints]
workspace = true
