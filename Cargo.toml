[workspace]
resolver = "2"
members = [
    "crates/taurus-provider",
    "crates/taurus-provider-ollama",
    "crates/taurus-tools",
    "crates/taurus-agents",
    "crates/taurus-core",
    "crates/taurus-skills",
    "crates/taurus-web",
    "crates/taurus-provider-openai",
    "crates/taurus-provider-anthropic",
    "crates/taurus-provider-gemini",
    "crates/taurus-mcp",
    "crates/taurus-index",
    "crates/taurus-data",
    "crates/taurus-hooks",
    "crates/taurus-process",
    "crates/taurus-watch",
    "crates/taurus-embed",
    "crates/taurus-host",
    "crates/taurus-telemetry",
    "crates/taurus-voice",
    "crates/taurus-speech",
    "crates/taurus-cli",
    "src-tauri",
]
# Patched, not ours to lint or test: see vendor/whisper-rs-sys/TAURUS.md.
exclude = ["vendor/whisper-rs-sys"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
taurus-provider = { path = "crates/taurus-provider" }
taurus-provider-ollama = { path = "crates/taurus-provider-ollama" }
taurus-provider-openai = { path = "crates/taurus-provider-openai" }
taurus-provider-anthropic = { path = "crates/taurus-provider-anthropic" }
taurus-provider-gemini = { path = "crates/taurus-provider-gemini" }
taurus-tools = { path = "crates/taurus-tools" }
taurus-agents = { path = "crates/taurus-agents" }
taurus-skills = { path = "crates/taurus-skills" }
taurus-web = { path = "crates/taurus-web" }
taurus-mcp = { path = "crates/taurus-mcp" }
taurus-index = { path = "crates/taurus-index" }
taurus-data = { path = "crates/taurus-data" }
taurus-hooks = { path = "crates/taurus-hooks" }
taurus-process = { path = "crates/taurus-process" }
taurus-watch = { path = "crates/taurus-watch" }
taurus-embed = { path = "crates/taurus-embed" }
taurus-host = { path = "crates/taurus-host" }
taurus-telemetry = { path = "crates/taurus-telemetry" }
taurus-voice = { path = "crates/taurus-voice" }
taurus-speech = { path = "crates/taurus-speech" }
taurus-core = { path = "crates/taurus-core" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = { version = "1", features = ["derive"] }
# `rustls` pulls rustls-platform-verifier, which reads the OS trust store
# directly. reqwest 0.13.2 dropped the separate `rustls-native-certs` optional
# dependency that used to be needed alongside it.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "http2", "charset", "rustls"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
# Credential storage. Held at 3.x: 4.x needs Rust 1.88 and this workspace
# promises 1.87. Features are selected per platform by the crate that uses it —
# there is no default backend, and the wrong one is a compile error rather than
# a silent no-op.
keyring = { version = "3.6", default-features = false }
# The macOS keychain, below `keyring`, for the one question `keyring` cannot ask:
# whether an entry exists, without reading the secret in it — which is the read
# that raises a permission dialog. The same major `keyring` itself uses, so this
# adds no second copy.
security-framework = "3"
# Line diffing for the permission prompt and the Changes drawer. The pre-image
# it reads is the one the checkpoint log takes a moment later, so showing a diff
# costs a read that was going to happen anyway.
similar = "2"
# Decoding pasted images, to check they are what they claim before a turn
# starts. Only ever decoded to look at — the base64 a frontend sends is the
# base64 the provider receives, so nothing here re-encodes.
base64 = "0.23"
# Pseudo-terminals for `run_command`. Real ones per platform — forkpty on unix,
# ConPTY on Windows — so a program that checks `isatty` behaves the way it does
# in a terminal on all three from the one codebase.
portable-pty = "0.9"
# Ending a process tree on Windows, in `taurus-process` and only there. A Job
# Object holds every process a child starts however its parents come and go,
# where a tree found by following parent links cannot reach one whose parent
# already exited. Starting the child suspended and assigning it before it runs
# are `unsafe` Win32 calls, which this workspace forbids in its own code. That
# needs 1.87; `rust-version` is 1.89 for `File::lock`, which keeps the CLI and
# the app from writing over each other's memory notes.
process-wrap = { version = "9.1", default-features = false, features = ["tokio1", "job-object", "creation-flags"] }
# The one type process-wrap's creation flags are spelled in. It has to be the
# version process-wrap itself uses, or the two are different types.
windows = { version = "0.62", features = ["Win32_System_Threading"] }
# Undoing Windows' `\\?\` canonicalization before a path is shown to anyone or
# handed to a child process. `std::fs::canonicalize` produces the verbatim form,
# `cmd.exe` cannot start in one, and every shell prints it in the prompt. Already
# in the tree as a transitive dependency, and a no-op everywhere but Windows.
dunce = "1"
# Reading the PATH Windows keeps in the registry, which is the one a new
# Windows Terminal tab gets and the one a long-running GUI process falls behind.
# Already in the tree through Tauri, and only compiled on Windows.
windows-registry = "0.6"
# Watching a workspace for changes, in `taurus-watch` and only there. Held at
# 8.2.1, the stable release: 9.0's release candidates carry the fix that makes
# a Windows `ReadDirectoryChangesW` overflow report itself, which is why the
# sweep keeps walking on Windows until 9.0 is final. See taurus-watch's header.
notify = "=8.2.1"
# `statfs`, to refuse watching a network or FUSE mount whose changes the
# operating system cannot report. Already in the tree, under tempfile.
rustix = { version = "1", features = ["fs"] }
# In-process embeddings, in `taurus-embed` and only there. Pure Rust: candle's
# CPU kernels are `gemm`, and the tokenizer is built with `fancy-regex` alone,
# because its defaults pull Oniguruma (C) and a C++ suffix array. macOS adds
# Apple's Accelerate framework, which is part of the OS. See taurus-embed's
# header for why not onnxruntime.
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
ignore = "0.4"
globset = "0.4"
# Hook matchers from Claude Code, Codex and Copilot files, which are regexes.
# Already in the tree under `ignore` and `globset`.
regex = "1"
# Whether two paths are one file. A rename that changes only a name's case finds
# its destination already there on macOS and Windows, because it is the source.
# Reads the file's identity on every platform — device and inode, or volume and
# file index — and is already in the tree under `ignore`.
same-file = "1"
# HTML to Markdown for `fetch_url`. A page arrives as markup and reaches the
# model as prose either way; converting keeps the headings and link targets that
# a plain-text render throws away.
htmd = "0.5"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

# Line tables for this workspace's own crates, and no debug info at all for
# dependencies. Full DWARF for DataFusion and Arrow across every test binary is
# most of what a dev build writes: target/ reached 342 GB on one machine. A
# panic's backtrace still names the file and line in our code, which is what a
# failing test needs; stepping through a dependency in a debugger needs this
# turned back on locally.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# whisper.cpp's FFI crate, carried here with one change to its build script:
# Windows builds use bindings generated on Windows and checked in, instead of
# running bindgen against whatever libclang the machine has. What changed and
# how to update it are in vendor/whisper-rs-sys/TAURUS.md.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
