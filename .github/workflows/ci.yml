name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint and unit tests run once on Linux — they are platform-independent and
  # repeating them on three OSes buys nothing.
  check:
    name: Lint and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The frontend's types come from Rust, so they must be regenerated before
      # the type check rather than committed and trusted.
      - name: Generate TypeScript bindings
        run: pnpm bindings

      - run: pnpm typecheck
      - run: pnpm test

  # The cross-platform surface is real: PTY behavior, interpreter resolution,
  # and path handling all differ. Building on each OS is what catches that.
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Platform-specific behavior lives in the tools and skills crates, so run
      # their tests on every OS even though the rest ran on Linux only.
      - run: cargo test -p taurus-tools -p taurus-skills

      # Through the same script a contributor runs, in the default shell of each
      # OS. Pinning this step to bash was what kept a Windows-only break in the
      # script invisible to a matrix that includes Windows.
      - name: Generate TypeScript bindings
        run: pnpm bindings

      - run: pnpm build
      # `custom-protocol` is what `tauri build` passes and what tells tauri this
      # is not a dev build. Without it the binary compiles and then looks for a
      # Vite server that is not there, which is a failure no CI step that only
      # builds would ever see.
      - run: cargo build --release -p taurus-app --features custom-protocol
      - run: cargo build --release -p taurus-cli

      # Exercises workspace resolution, skill discovery, and registry assembly
      # on each platform without needing a model.
      - name: Smoke-test the CLI
        shell: bash
        run: |
          ./target/release/taurus tools
          ./target/release/taurus skills list
