name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The workflows are the one thing here no other job compiles. A release.yml
  # that references an undefined context or a nonexistent runner is only found
  # by running it, and running it means pushing a tag — so it stayed broken
  # through several merges without a single red check. actionlint reads them as
  # code; the `jobs.release.outputs` reference that made every tag a no-op is
  # exactly what it reports, and it takes about ten seconds.
  workflows:
    name: Lint workflows
    runs-on: ubuntu-22.04
    # Every job here is bounded, because the default is six hours and a test
    # that hangs is a thing that happens: `kill -KILL -<pid>` with a pid out of
    # range means "every process this user owns" on Linux, so a bad argument
    # killed the runner agent from inside the test run and the job sat there
    # with no output until somebody cancelled it. Each ceiling below is roughly
    # double what the step costs when it is working.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned. Unpinned, a new actionlint release turns unrelated pull requests
      # red for a rule nobody in them chose to adopt.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # Lint and unit tests run once on Linux — they are platform-independent and
  # repeating them on three OSes buys nothing.
  check:
    name: Lint and test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved even when the job fails. The default is to save only on success,
      # which means one flaky test costs the *next* push a cold build as well —
      # and on Windows that is over an hour. What was compiled is just as valid
      # whether or not a test passed afterwards.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The frontend's types come from Rust, so they must be regenerated before
      # the type check rather than committed and trusted.
      - name: Generate TypeScript bindings
        run: pnpm bindings

      - run: pnpm typecheck
      - run: pnpm test

  # The cross-platform surface is real: PTY behavior, interpreter resolution,
  # and path handling all differ. Building on each OS is what catches that.
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is the slow one and it is slow honestly. The number was 45, set
    # when a cold release build of the app there was six minutes on its own,
    # and it stopped being generous without anybody changing it: measured on
    # three branches in one afternoon, macOS came in at 44m40s and 40m01s —
    # *inside* the budget by twenty seconds — and Windows was cancelled at the
    # wall three times running, always partway through `cargo build --release`.
    #
    # What grew is the dependency tree. A release build of DataFusion and its
    # Arrow half is most of an hour from cold, and it is cold on every new
    # branch: `rust-cache` keys on the branch, so the first push to one pays
    # for all of it. A timeout tuned to the old tree reads as a Windows-only
    # failure and is really a clock.
    #
    # 120, and the number is measured rather than picked. One cold Windows run,
    # step by step: 4m of tests, 12m to generate the bindings, 36m to build the
    # app in release, and 18m more for the CLI, which shares no artifacts with
    # it. That is 70 minutes of compiling before any overhead, and 45 — and
    # then 75 — cut it partway through.
    #
    # Raising it generously is nearly free and *not* raising it is not, because
    # the failure feeds itself. `rust-cache` does not save on a cancelled job:
    # `Post Run Swatinem/rust-cache@v2` is skipped, so a run killed by this
    # clock leaves the cache exactly as cold as it found it, and the next run
    # pays the full 70 minutes again. Three afternoons of red X's on unrelated
    # pull requests came out of that loop. A budget large enough for one run to
    # finish ends it, because the run after that starts warm.
    #
    # A ceiling is not a target: GitHub bills the minutes used, so a job that
    # finishes in twelve costs twelve. What this buys is that a genuinely hung
    # job is still caught, two hours later rather than never.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      # Saved even when the job fails. The default is to save only on success,
      # which means one flaky test costs the *next* push a cold build as well —
      # and on Windows that is over an hour. What was compiled is just as valid
      # whether or not a test passed afterwards.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Platform-specific behavior lives in these four: process spawning and
      # path handling in tools, interpreter resolution in skills, the Windows
      # launcher shim in mcp, and — since hooks run programs and have to be
      # able to stop them again — ending a process tree, which is a process
      # group on Unix and `taskkill /T` on Windows. Run their tests on every OS
      # even though the rest ran on Linux only.
      - run: cargo test -p taurus-tools -p taurus-skills -p taurus-mcp -p taurus-hooks

      # Through the same script a contributor runs, in the default shell of each
      # OS. Pinning this step to bash was what kept a Windows-only break in the
      # script invisible to a matrix that includes Windows.
      - name: Generate TypeScript bindings
        run: pnpm bindings

      - run: pnpm build
      # `custom-protocol` is what `tauri build` passes and what tells tauri this
      # is not a dev build. Without it the binary compiles and then looks for a
      # Vite server that is not there, which is a failure no CI step that only
      # builds would ever see.
      - run: cargo build --release -p taurus-app --features custom-protocol
      - run: cargo build --release -p taurus-cli

      # Exercises workspace resolution, skill discovery, and registry assembly
      # on each platform without needing a model.
      - name: Smoke-test the CLI
        shell: bash
        run: |
          ./target/release/taurus tools
          ./target/release/taurus skills list
