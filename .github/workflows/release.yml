name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run: builds all three platforms, uploads nothing, publishes nothing.
  # Worth having because the alternative way to test this file is to cut a real
  # tag against the real repository, and every bug found that way is found in
  # public. The bundles land as workflow artifacts so a run can be inspected as
  # well as passed.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can fail in seconds, before anything that takes twenty
  # minutes. Both steps here guard a failure that a green build would otherwise
  # hand straight to whoever downloads it.
  prepare:
    name: Check the version and open a draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No pnpm install: the script imports nothing outside node's standard
      # library, precisely so this job stays a few seconds long.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The version lives in `package.json`, `Cargo.toml`, and
      # `tauri.conf.json`, and the tag is a fourth copy. `tauri-action` names
      # the release from the tag and the bundles from `tauri.conf.json`, so a
      # tag pushed against an unbumped tree produces a v0.2.0 release full of
      # `Taurus_0.1.0_…` files — green, published, and wrong on every asset.
      - name: The version in the tree matches the tag
        env:
          # Empty on a dry run, which the script reads as "no tag to match" and
          # still uses to check the three files against each other.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/version.mjs check "$TAG"

      # Created here, as a draft, rather than left to `tauri-action`. Three
      # reasons, in order of how badly each bites:
      #
      # Published-by-default is wrong for a matrix. `releaseDraft` defaults to
      # false, so the first platform to finish publishes the release and the
      # other two upload into something the world can already see. macOS builds
      # two architectures for the universal target and finishes last by a wide
      # margin, so the visible state for most of the run is a live release with
      # no Mac build in it.
      #
      # `tauri-action` cannot create a release without `releaseName`. Its create
      # path logs "releaseName not set but required to create release" and then
      # throws `Release not found or created.` — so on a first tag, with no
      # release to find, every platform fails on a message that names neither
      # the input nor this file.
      #
      # And three jobs racing to get-or-create the same release is a race worth
      # not having. One job, once, before any of them start.
      - name: Open the draft release
        id: draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A draft has no tag as far as the API is concerned, so it cannot be
          # looked up by one — the list endpoint is the only way to find it.
          # This is what makes a re-run after one platform fails attach to the
          # draft that is already there instead of opening a second one.
          #
          # Captured whole and trimmed to its first line rather than piped into
          # `head`. A pipe would hide a failed `gh` behind head's exit status,
          # and `pipefail` would trade that for the opposite bug: `head` closing
          # the pipe early, `gh --paginate` taking a SIGPIPE for it, and a
          # successful lookup failing the job.
          ids=$(gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | .id')
          id=${ids%%$'\n'*}

          if [ -n "$id" ]; then
            echo "Reusing the draft already open for $TAG (release $id)."
          else
            # `generate_release_notes` fills in both the title and the body from
            # the commits since the last tag. Notes worth reading still want
            # writing by hand — this is the floor, applied before the release is
            # visible, so the draft is never empty while it waits to be edited.
            id=$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)
            echo "Opened draft release $id for $TAG."
          fi

          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    name: Tauri release (${{ matrix.os }})
    needs: prepare
    # Uploading assets to the release is a write to the repository. Without this
    # the run reaches `tauri-action` and fails on a 403 from the default token,
    # which reads as an auth problem rather than a missing line.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is Apple Silicon. Left to itself the bundle it produces is
          # arm64-only, so an Intel Mac gets nothing out of the release at all —
          # the universal target is what puts both architectures in one .dmg,
          # and it needs both Rust targets installed to build.
          - os: macos-26
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Matching the CI profile exactly, down to the runner image.
          - os: ubuntu-22.04
            args: ''
            rust_targets: ''
          - os: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # libasound2-dev is the ALSA headers cpal builds against, for the
      # microphone in taurus-voice, and libclang-dev is what bindgen reads
      # whisper.cpp's headers with. Neither is a WebView package, but both
      # have to be there before anything that links the app compiles. The
      # Windows runner ships LLVM, and macOS has libclang with Xcode.
      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libclang-dev

      # This action has no version tags, only a branch per toolchain, so the
      # comment names the branch this commit was the tip of on 2026-10-16. The
      # toolchain is said out loud because the ref no longer says it.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/bindings` is generated and gitignored, so on a fresh checkout it
      # does not exist. `tauri build` runs `pnpm build` as its beforeBuildCommand
      # and that starts with `tsc --noEmit`, which means without this step every
      # platform fails on `Cannot find module "../bindings/…"` before a single
      # bundle is written. CI regenerates them before every typecheck for the
      # same reason; this is the one workflow that has to do it too.
      - name: Generate TypeScript bindings
        run: pnpm bindings

      # Code signing, each half on only when its secrets are there. An empty
      # variable is not the same as an absent one: the bundler sees
      # `APPLE_CERTIFICATE=""` as a certificate to import and fails on it, so
      # passing every secret straight into `env` would break the unsigned build
      # for anyone without them, a fork included. Only the ones that have a
      # value are exported.
      #
      # macOS: a Developer ID Application certificate (the .p12, base64) is
      # imported into a throwaway keychain by the bundler, and the app is
      # notarized with an app-specific password. Without notarization a signed
      # app still meets Gatekeeper's "cannot be opened" on first launch.
      - name: Load the macOS signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret; the macOS build is unsigned and Gatekeeper will stop it."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::APPLE_CERTIFICATE is set but $name isn't; signing needs all six."
              exit 1
            fi
            # A base64 certificate is one long line, which is what GITHUB_ENV's
            # NAME=value form needs.
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      # Windows: Azure Trusted Signing, the route that doesn't need a hardware
      # token on the runner. The sign command lives in a config file written
      # here and merged with `--config`, not in `tauri.conf.json`, because a
      # `signCommand` there runs on every local Windows build too, and fails on
      # every machine that isn't this runner.
      #
      # Three steps, so the signing tool's own build never sees a secret. `cargo
      # install` runs the build scripts of everything it compiles, and an env
      # holding AZURE_CLIENT_SECRET would hand it to each of them. The version is
      # pinned for the same reason: what compiles next to the signing job is
      # whatever was reviewed, not whatever was newest that day.
      - name: Check the Windows signing secrets
        id: winsecrets
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::warning::No AZURE_CLIENT_ID secret; the Windows build is unsigned and SmartScreen will warn on it."
            exit 0
          fi
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID ENDPOINT ACCOUNT PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::AZURE_CLIENT_ID is set but the secret behind $name isn't; signing needs all six."
              exit 1
            fi
          done
          echo "signing=true" >> "$GITHUB_OUTPUT"

      - name: Install the signing tool
        if: steps.winsecrets.outputs.signing == 'true'
        shell: bash
        run: cargo install trusted-signing-cli --locked --version 0.11.0

      - name: Set up Windows signing
        id: winsign
        if: steps.winsecrets.outputs.signing == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          # `%1` is the file the bundler is signing: the exe, then each installer.
          # Concatenated rather than a template literal, whose `${…}` inside
          # the shell's single quotes reads to shellcheck as a mistake.
          node -e '
            const { ENDPOINT, ACCOUNT, PROFILE } = process.env;
            const signCommand =
              "trusted-signing-cli -e " + ENDPOINT + " -a " + ACCOUNT + " -c " + PROFILE + " -d Taurus %1";
            require("node:fs").writeFileSync(
              "windows-signing.json",
              JSON.stringify({ bundle: { windows: { signCommand } } }),
            );
          '
          echo "args=--config windows-signing.json" >> "$GITHUB_OUTPUT"

      # Builds the bundles named by `tauri.conf.json` (`bundle.targets: all`),
      # then uploads them to the draft `prepare` opened. On a dry run
      # `releaseId` and `tagName` are both empty, which is how this action is
      # told to build and upload nothing; the two steps below keep the bundles.
      #
      # Pinned to the commit of v0.6.2, because this step holds the updater's
      # private key: a tag can be moved, and a commit can't. It's still a v0
      # release, and worth knowing which docs describe it: the README
      # on this action's default branch is v1's, and v1 renamed or added
      # several inputs. An input v0 does not know is not an error — it is a
      # warning in the log and an input nothing reads. Check a name against
      # `action.yml` on the `action-v0.x` tag rather than against the README.
      - name: Build and upload to the draft release
        id: build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
          includeDebug: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's signing key. `bundle.createUpdaterArtifacts` makes
          # every bundle come with a `.sig`, and `tauri build` fails outright
          # without this key, so a release can't ship unsigned updates by
          # accident. The app checks each `.sig` against `plugins.updater.pubkey`
          # before it installs anything.
          #
          # The password's variable is `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`.
          # `TAURI_SIGNING_PASSWORD` is the secret's name, and is not a name
          # the bundler reads: passed under it, an encrypted key fails to
          # decrypt.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}

      # What makes a dry run inspectable rather than merely green. `v0` has no
      # `uploadWorkflowArtifacts` input to do this — passing one built three
      # platforms and left nothing behind, which a passing run said nothing
      # about. Done here instead, from the paths the build reports, so an empty
      # build fails the step rather than uploading an empty directory.
      #
      # Node rather than jq or shell: `setup-node` has already run on all three
      # runners, `artifactPaths` arrives as a JSON array, and a `.app` is a
      # directory while a `.dmg` is a file — one `cpSync` handles both, on an
      # OS where `/bin/bash` is still 3.2.
      - name: Stage the bundles
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          node -e '
            const { cpSync, mkdirSync } = require("node:fs");
            const { basename, join } = require("node:path");
            const paths = JSON.parse(process.env.ARTIFACT_PATHS ?? "[]");
            if (paths.length === 0) {
              console.error("the build reported no bundles to stage");
              process.exit(1);
            }
            mkdirSync("dry-run-bundles", { recursive: true });
            for (const path of paths) {
              console.log(path);
              cpSync(path, join("dry-run-bundles", basename(path)), { recursive: true });
            }
          '

      - name: Keep the bundles from the dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Per-OS, so the three legs cannot collide on a name.
          name: bundles-${{ matrix.os }}
          path: dry-run-bundles/
          if-no-files-found: error

  # `needs` is the whole point: the release becomes visible when all three
  # platforms have uploaded, and not before. If one fails, the draft stays a
  # draft with the other two attached — a re-run adds the missing platform to
  # that same draft rather than starting over.
  publish:
    name: Publish the release
    needs: [prepare, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Each platform job merges its own entry into the one `latest.json` on
      # the draft by downloading it, adding to it and uploading it again. Two
      # jobs that finish close together can each upload a copy missing the
      # other's entry, and a release published like that leaves one platform's
      # users never offered the update, with nothing failing to say so. So the
      # file is read back here and the release stays a draft unless every
      # platform is in it. Re-running the job whose platform is missing adds it.
      - name: Every platform is in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          asset=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::The draft has no latest.json, so no installed copy would be offered this update."
            exit 1
          fi
          gh api "repos/$REPO/releases/assets/$asset" \
            -H "Accept: application/octet-stream" > latest.json
          missing=$(jq -r '["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"]
            - (.platforms | keys) | join(" ")' latest.json)
          if [ -n "$missing" ]; then
            echo "::error::latest.json has no entry for: $missing. Re-run the job for that platform, then this one."
            exit 1
          fi
          jq -r '.platforms | keys | join(", ")' latest.json

      # By id, not by tag: a draft cannot be addressed by its tag, which is why
      # `gh release edit "$TAG"` would not find this one.
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag is restated because an edit to the draft that left it out
          # clears it, and publishing then mints `untagged-<hash>` at main's tip
          # instead of the commit the bundles were built from.
          url=$(gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -F draft=false --jq .html_url)
          echo "Published: $url"
          echo "Published: $url" >> "$GITHUB_STEP_SUMMARY"
