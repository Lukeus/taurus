<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Taurus</title>
    <style>
      /* The app fills a Tauri window, which has no page margin and never
         scrolls as a document. The capture viewport stands in for that. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
