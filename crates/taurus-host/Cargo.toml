[package]
name = "taurus-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Frontend-agnostic assembly of the Taurus harness: config, prompts, and the tool registry"

[dependencies]
taurus-core.workspace = true
taurus-mcp.workspace = true
taurus-provider.workspace = true
taurus-provider-ollama.workspace = true
taurus-provider-openai.workspace = true
taurus-skills.workspace = true
taurus-tools.workspace = true
taurus-web.workspace = true

async-trait.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true

# No default backend exists, so each platform names its own. Anything not listed
# here — a BSD, a headless box with no Secret Service — compiles without a
# keychain and falls back to environment variables, which `secrets` reports
# rather than hides.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
