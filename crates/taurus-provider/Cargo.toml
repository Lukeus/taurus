[package]
name = "taurus-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Provider-agnostic message, stream, and tool types for the Taurus agent harness"

[features]
# The HTTP client every adapter shares. Off by default so the crate that only
# defines the types does not pull in a TLS stack for the ones that never
# make a request.
http = ["dep:reqwest", "dep:futures", "dep:bytes", "dep:tracing", "tokio/net"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing = { workspace = true, optional = true }
ts-rs.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
