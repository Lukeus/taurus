[package]
name = "taurus-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP client for the Taurus agent harness"

[dependencies]
taurus-provider.workspace = true
taurus-tools.workspace = true
async-trait.workspace = true
futures.workspace = true
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    # OAuth for HTTP servers. Brings `oauth2` and with it discovery, PKCE,
    # dynamic client registration, issuer validation and refresh — every part of
    # the flow that is specification rather than judgement. See `oauth`.
    "auth",
] }
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url = "2"
tracing.workspace = true
ts-rs.workspace = true

[dev-dependencies]
base64.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
