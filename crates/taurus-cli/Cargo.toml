[package]
name = "taurus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line frontend for the Taurus agent harness"

[[bin]]
name = "taurus"
path = "src/main.rs"

[dependencies]
taurus-core.workspace = true
taurus-host.workspace = true
taurus-provider.workspace = true
taurus-skills.workspace = true
taurus-tools.workspace = true

async-trait.workspace = true
clap = { version = "4", features = ["derive"] }
# Terminal echo suppression for `taurus key set`. Doing this by hand means
# termios on unix and console APIs on Windows, for a prompt.
rpassword = "7"
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
